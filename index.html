<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7ef">
  <title>ဆက်သွယ်ရန်</title>
  <style>
    :root {
      --bg: #f7f7ef;
      --green: #245b38;
      --green-dark: #17452a;
      --gold: #d5bd62;
      --text: #284333;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Noto Sans Myanmar", "Myanmar Text", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    main {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: 24px;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #fffef8 0%, #f7f7ef 58%, #eef1e4 100%);
    }
    .circle {
      position: absolute;
      z-index: -1;
      border-radius: 50%;
      pointer-events: none;
    }
    .circle.one {
      width: min(76vw, 620px);
      aspect-ratio: 1;
      top: -34%;
      left: -22%;
      border: 1px solid #d5bd6280;
      box-shadow: 0 0 0 24px #245b3808, inset 0 0 0 18px #d5bd6214;
    }
    .circle.two {
      width: min(70vw, 560px);
      aspect-ratio: 1;
      right: -25%;
      bottom: -40%;
      background: linear-gradient(145deg, #245b3815, #d5bd6230);
      border: 1px solid #245b3825;
    }
    .circle.three {
      width: clamp(230px, 36vw, 390px);
      aspect-ratio: 1;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid #245b3822;
      box-shadow: 0 0 0 15px #d5bd620b, 0 0 0 32px #245b3808;
    }
    .dot {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 7px #d5bd621f;
    }
    .dot.a { top: 29%; left: 28%; }
    .dot.b { right: 27%; bottom: 28%; width: 6px; height: 6px; background: var(--green); }
    .content {
      width: min(100%, 440px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .tagline {
      margin: 0 0 42px;
      font-size: clamp(13px, 2.5vw, 17px);
      line-height: 1.9;
      color: var(--green);
    }
    .tagline::before, .tagline::after {
      content: "";
      display: inline-block;
      width: 25px;
      height: 1px;
      margin: 0 12px 5px;
      background: var(--gold);
    }
    .contact {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      min-height: 82px;
      padding: 20px 25px;
      border: 1px solid #d5bd62;
      border-radius: 999px;
      background: linear-gradient(120deg, var(--green), var(--green-dark));
      color: #fffef7;
      text-decoration: none;
      font-size: clamp(22px, 4vw, 29px);
      font-weight: 700;
      box-shadow: 0 15px 32px #245b3826, inset 0 1px 0 #ffffff40;
      transition: transform .18s ease, box-shadow .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .contact:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 36px #245b3830, inset 0 1px 0 #ffffff40;
    }
    .contact:focus-visible { outline: 3px solid var(--gold); outline-offset: 5px; }
    .arrow {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border: 1px solid #ffffff70;
      border-radius: 50%;
      font: 22px/1 Arial, sans-serif;
    }
    @media (max-width: 520px) {
      .tagline { margin-bottom: 34px; }
      .tagline::before, .tagline::after { width: 15px; margin-inline: 7px; }
      .contact { min-height: 72px; padding: 17px 18px; }
      .circle.one { width: 90vw; top: -15%; left: -38%; }
      .circle.two { width: 100vw; right: -48%; bottom: -25%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .contact { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="circle one" aria-hidden="true"></div>
    <div class="circle two" aria-hidden="true"></div>
    <div class="circle three" aria-hidden="true"></div>
    <span class="dot a" aria-hidden="true"></span>
    <span class="dot b" aria-hidden="true"></span>
    <section class="content" aria-label="ဆက်သွယ်ရန်">
      <p class="tagline">သင်လိုအပ်ချိန်တိုင်း အသင့်ရှိနေပါမည်</p>
      <a class="contact" href="https://newm9asia.com/" target="_blank" rel="noopener noreferrer">
        <span>ဆက်သွယ်ရန်</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </section>
  </main>
</body>
</html>
