<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8fbf5">
  <meta name="description" content="New M9 Asia — ဆက်သွယ်ရန်">
  <title>New M9 Asia | ဆက်သွယ်ရန်</title>
  <style>
    :root {
      --green: #28734b;
      --deep-green: #174b34;
      --leaf: #a6c96b;
      --gold: #d8b75b;
      --cream: #fbfcf6;
      --ink: #263b30;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 18%, rgba(166,201,107,.19) 0 7%, transparent 7.3%),
        radial-gradient(circle at 85% 78%, rgba(216,183,91,.15) 0 10%, transparent 10.3%),
        radial-gradient(circle at 82% 16%, rgba(40,115,75,.08) 0 13%, transparent 13.3%),
        linear-gradient(145deg, #ffffff 0%, var(--cream) 58%, #eef5e9 100%);
      font-family: "Noto Sans Myanmar", "Myanmar Text", system-ui, sans-serif;
    }
    .orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(1px);
      z-index: 0;
    }
    .orb.one {
      width: 280px; height: 280px; top: -100px; right: -65px;
      border: 1px solid rgba(40,115,75,.16);
      box-shadow: 0 0 0 24px rgba(40,115,75,.025), 0 0 0 52px rgba(40,115,75,.018);
    }
    .orb.two {
      width: 210px; height: 210px; bottom: -80px; left: -50px;
      background: radial-gradient(circle, rgba(216,183,91,.14), rgba(216,183,91,0) 70%);
    }
    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 560px);
      padding: clamp(34px, 7vw, 62px) clamp(24px, 6vw, 54px);
      text-align: center;
      border: 1px solid rgba(40,115,75,.10);
      border-radius: 30px;
      background: rgba(255,255,255,.76);
      box-shadow: 0 22px 70px rgba(30,72,46,.09), 0 3px 12px rgba(30,72,46,.04);
      backdrop-filter: blur(8px);
    }
    .decor {
      width: 78px; height: 78px; margin: 0 auto 27px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: linear-gradient(145deg, #edf6df, #fff8df);
      border: 1px solid rgba(40,115,75,.13);
      box-shadow: 0 8px 22px rgba(40,115,75,.10), inset 0 0 0 7px rgba(255,255,255,.55);
    }
    .decor svg { width: 32px; height: 32px; }
    .eyebrow {
      margin: 0 0 13px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .18em;
    }
    h1 {
      margin: 0;
      font-size: clamp(25px, 5.5vw, 35px);
      line-height: 1.55;
      font-weight: 700;
      letter-spacing: -.025em;
      color: var(--deep-green);
    }
    .rule {
      width: 54px; height: 3px; margin: 23px auto 25px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--leaf), var(--gold));
    }
    .tagline {
      margin: 0 auto 34px;
      max-width: 340px;
      color: #64766a;
      font-size: clamp(13px, 3.5vw, 15px);
      line-height: 1.9;
    }
    .contact {
      min-height: 62px;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 24px;
      border: 0;
      border-radius: 15px;
      color: #fff;
      background: linear-gradient(110deg, var(--deep-green), var(--green));
      box-shadow: 0 12px 25px rgba(40,115,75,.22), inset 0 1px 0 rgba(255,255,255,.18);
      text-decoration: none;
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .contact:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 30px rgba(40,115,75,.27), inset 0 1px 0 rgba(255,255,255,.18);
    }
    .contact:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
    .contact svg { width: 20px; height: 20px; flex: 0 0 auto; }
    .bottom-note {
      margin: 24px 0 0;
      color: #8a988e;
      font-size: 11px;
      letter-spacing: .04em;
    }
    @media (max-width: 420px) {
      .page { border-radius: 24px; }
      .contact { min-height: 58px; font-size: 17px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .contact { transition: none; }
    }
  </style>
</head>
<body>
  <div class="orb one" aria-hidden="true"></div>
  <div class="orb two" aria-hidden="true"></div>
  <main class="page">
    <div class="decor" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 20.5V10.2" stroke="#28734b" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M12 13.8C5.8 13.8 4.6 9.3 4.6 6.8c4.2 0 7.4 1.9 7.4 7Z" fill="#a6c96b" stroke="#28734b" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M12 10.8c0-4.3 2.9-6.3 6.9-6.3 0 4.4-2.3 7.1-6.9 7.1" fill="#d8b75b" stroke="#28734b" stroke-width="1.2" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="eyebrow">WELCOME</p>
    <h1>သင်လိုအပ်ချိန်တိုင်း<br>အသင့်ရှိနေပါမည်</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="tagline">အကူအညီလိုအပ်ပါက အောက်ပါခလုတ်မှတစ်ဆင့် ဆက်သွယ်နိုင်ပါသည်။</p>
    <a class="contact" href="https://newm9asia.com/" target="_blank" rel="noopener noreferrer">
      <span>ဆက်သွယ်ရန်</span>
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M7 17 17 7M8 7h9v9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <p class="bottom-note">သင့်အတွက် အမြဲအသင့်ရှိနေပါမည်</p>
  </main>
</body>
</html>
